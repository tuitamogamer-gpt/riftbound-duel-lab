<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central action stack QA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Development-only fixtures. Keep these on an isolated localhost origin.
      import { applyActionStepped, getLegalActions } from "/src/game/engine.ts";
      import { createCombatFixture, combatUnit } from "./fixtures/combat.ts";
      import { SAVE_KEY, parseSession } from "/src/persistence.ts";
      import { LANGUAGE_KEY } from "/src/i18n/core.ts";
      const mode = new URLSearchParams(location.search).get("mode") || "chain";
      let match = createCombatFixture();
      let review = null;
      match.phase = "main";
      match.combat = null;
      match.turnStep = "main";
      match.chainStarter = null;
      match.consecutivePasses = 0;
      match.units = [
        combatUnit("ally", 0, 5, "ogn-049-298"),
        combatUnit("enemy", 1, 8, "ogn-088-298"),
        {
          ...combatUnit("ally-right", 0, 4, "ogn-219-298"),
          location: "field:1",
        },
        {
          ...combatUnit("enemy-right", 1, 3, "ogn-175-298"),
          location: "field:1",
        },
      ];
      match.fields[0].controller = 0;
      match.fields[1].controller = 1;
      for (const p of match.players) {
        p.hand = [];
        p.energy = 8;
        p.runes = [{ id: `ready-${p.id}`, domain: "Calm", ready: true }];
      }
      const incoming = {
        id: "incoming-ray",
        cardId: "ogn-009-298",
        player: 1,
        targetId: "ally",
        locationId: "field:0",
        kind: "spell",
        effects: [{ type: "damage", amount: 3, target: "unitAtBattlefield" }],
      };
      if (["chain", "triple", "reaction", "effect"].includes(mode)) {
        match.stack = [incoming];
        match.chainStarter = 1;
        match.focusPlayer = 1;
        match.players[0].hand = ["ogn-046-298"];
        if (["chain", "triple"].includes(mode)) {
          match.stack.push({
            id: "reaction-discipline",
            cardId: "ogn-058-298",
            player: 0,
            targetId: "ally",
            locationId: "field:0",
            kind: "spell",
            effects: [
              { type: "might", amount: 2, target: "anyUnit" },
              { type: "draw", amount: 1 },
            ],
          });
          if (mode === "triple")
            match.stack.push({
              id: "reaction-wind-wall",
              cardId: "ogn-064-298",
              player: 1,
              targetId: "reaction-discipline",
              locationId: "field:0",
              kind: "spell",
              effects: [{ type: "counter", target: "spell" }],
            });
        } else if (mode === "effect") {
          match.priorityPlayer = 0;
          match.consecutivePasses = 1;
          const before = match;
          const action = getLegalActions(before, 0).find(
            (a) => a.id === "pass",
          );
          const result = applyActionStepped(before, action);
          match = result.state;
          const index = result.frames.findIndex(
            (f) => f.effect?.stage === "applied",
          );
          review = {
            before,
            final: match,
            frames: result.frames,
            index,
            action,
          };
        }
      } else if (["human-play", "ai-play", "hidden"].includes(mode)) {
        const player = mode === "human-play" ? 0 : 1;
        match.currentPlayer = player;
        match.priorityPlayer = player;
        match.focusPlayer = player;
        match.players[player].hand = [
          mode === "hidden" ? "ogn-083-298" : "ogn-049-298",
        ];
        match.fields[0].controller = player;
        const before = match;
        const action = getLegalActions(before, player).find((a) =>
          mode === "hidden"
            ? a.id === "hide:0:field:0"
            : a.category === "play" && a.sourceId === "hand:0",
        );
        if (!action) throw new Error(`Missing deterministic ${mode} action`);
        const result = applyActionStepped(before, action);
        match = result.state;
        review = {
          before,
          final: match,
          frames: result.frames,
          index: 0,
          action,
        };
      } else if (mode === "crowded") {
        match.units = Array.from({ length: 24 }, (_, i) => ({
          ...combatUnit(
            `crowd-${i}`,
            i % 2,
            3,
            ["ogn-049-298", "ogn-175-298", "ogn-088-298", "ogn-219-298"][i % 4],
          ),
          ready: i % 3 === 0,
          location: i < 12 ? "field:0" : "field:1",
        }));
      }
      if (new URLSearchParams(location.search).has("crowded")) {
        match.units = Array.from({ length: 24 }, (_, i) => ({
          ...combatUnit(
            i === 0 ? "ally" : i === 1 ? "enemy" : i === 12 ? "ally-right" : i === 13 ? "enemy-right" : `crowd-${i}`,
            i % 2,
            5,
            ["ogn-049-298", "ogn-175-298", "ogn-088-298", "ogn-219-298"][i % 4],
          ),
          ready: false,
          location: i < 12 ? "field:0" : "field:1",
        }));
      }
      if (new URLSearchParams(location.search).has("bases")) {
        match.units.push(
          { ...combatUnit("base-ally", 0, 4, "ogn-049-298"), location: "base:0" },
          { ...combatUnit("base-enemy", 1, 4, "ogn-088-298"), location: "base:1" },
        );
      }
      const session = { match, review };
      if (!parseSession(JSON.stringify(session)).match)
        throw new Error(`Invalid ${mode} QA session`);
      localStorage.setItem(LANGUAGE_KEY, "en");
      localStorage.setItem(SAVE_KEY, JSON.stringify(session));
      // Tests may inspect public engine metadata; no production global is added.
      window.actionStackFixture = {
        mode,
        frameCount: review?.frames.length ?? 0,
        targetIds: [...new Set(getLegalActions(match, 0)
          .filter((action) => action.category === "play" && action.sourceId === "hand:0")
          .map((action) => action.targetId).filter(Boolean))],
      };
      await import("/src/main.tsx");
    </script>
  </body>
</html>
