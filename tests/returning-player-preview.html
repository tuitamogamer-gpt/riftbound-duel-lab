<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Returning player QA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createTrainingPosition } from "/src/game/training.ts";
      import { createReplay } from "/src/game/ai/replay.ts";
      import { applyAction, getLegalActions } from "/src/game/engine.ts";
      import { writeCompletedMatch } from "/src/game/match-history.ts";
      import { SAVE_KEY } from "/src/persistence.ts";
      import { DUEL_GUIDE_KEY } from "/src/game/duel-guide.ts";
      if (!["localhost", "127.0.0.1", "[::1]"].includes(location.hostname))
        throw new Error(
          "Returning-player fixtures are restricted to loopback origins",
        );
      const params = new URLSearchParams(location.search);
      const names = [
        ["Vi · Unleashed", "Viktor · Origins"],
        ["Shen · Vendetta", "Jinx · Origins"],
        ["Vi · Unleashed", "Lux · Proving Grounds"],
      ];
      for (let i = 0; i < 3; i++) {
        let game = createTrainingPosition("hold");
        game.seed = 803 + i;
        game.turn = 5 + i;
        if (i) {
          game.players[0].points = 0;
          game.players[1].points = 7;
          game.units.forEach((unit) => {
            unit.owner = 1;
          });
          game.fields.forEach((field) => {
            if (field.controller === 0) field.controller = 1;
          });
        }
        const replay = createReplay(game);
        for (let n = 0; n < 3 && game.winner === null; n++) {
          const action = getLegalActions(game, game.priorityPlayer).find(
            (action) => action.id === "end-turn",
          );
          if (!action) throw new Error("Fixture has no end-turn action");
          replay.decisions.push({ action });
          game = applyAction(game, action);
          replay.finalRevision = game.revision;
        }
        const result = writeCompletedMatch(replay, {
          playerDeckName: names[i][0],
          opponentDeckName: names[i][1],
          endedAt: `2026-10-${12 + i}T12:00:00Z`,
        });
        if (!result.saved) throw new Error(result.error);
      }
      const match = createTrainingPosition("deploy");
      if (params.get("mode") === "overview") {
        match.players[0].hand = [];
        match.players[0].championAvailable = false;
        match.units = [];
        match.fields.forEach((field) => {
          field.controller = null;
        });
      }
      localStorage.setItem(
        SAVE_KEY,
        JSON.stringify({ match, review: null, paused: false }),
      );
      localStorage.setItem(
        DUEL_GUIDE_KEY,
        JSON.stringify({
          version: 1,
          seed: match.seed,
          enabled: false,
          seen: ["opening"],
        }),
      );
      localStorage.setItem(
        "riftbound-duel-language",
        params.get("lang") || "en",
      );
      localStorage.setItem("riftbound-duel-playback-speed", "2");
      await import("/src/main.tsx");
    </script>
  </body>
</html>
