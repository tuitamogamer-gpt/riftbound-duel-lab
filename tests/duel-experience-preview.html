<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guided duel and recap QA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createTrainingPosition } from "/src/game/training.ts";
      import { applyAction, getLegalActions } from "/src/game/engine.ts";
      import { createReplay, BOT_AUDIT_KEY } from "/src/game/ai/replay.ts";
      import { DUEL_GUIDE_KEY } from "/src/game/duel-guide.ts";
      import { SAVE_KEY } from "/src/persistence.ts";
      if (!["localhost", "127.0.0.1", "[::1]"].includes(location.hostname))
        throw new Error("Duel QA fixtures are restricted to loopback origins");
      const params = new URLSearchParams(location.search);
      const scenario = params.get("scenario") || "deploy";
      let match = createTrainingPosition(
        scenario === "result" ? "hold" : scenario,
      );
      if (scenario === "result") {
        const replay = createReplay(match);
        for (let i = 0; i < 2; i++) {
          const action = getLegalActions(match, match.priorityPlayer).find(
            (action) => action.id === "end-turn",
          );
          replay.decisions.push({ action });
          match = applyAction(match, action);
          replay.finalRevision = match.revision;
        }
        localStorage.setItem(BOT_AUDIT_KEY, JSON.stringify(replay));
      }
      localStorage.setItem(
        SAVE_KEY,
        JSON.stringify({ match, review: null, paused: false }),
      );
      localStorage.setItem(
        DUEL_GUIDE_KEY,
        JSON.stringify({
          version: 1,
          seed: match.seed,
          enabled: scenario !== "result" && !params.has("unguided"),
          seen: [],
        }),
      );
      localStorage.setItem(
        "riftbound-duel-language",
        params.get("lang") || "en",
      );
      localStorage.setItem("riftbound-duel-playback-speed", "2");
      await import("/src/main.tsx");
    </script>
  </body>
</html>
