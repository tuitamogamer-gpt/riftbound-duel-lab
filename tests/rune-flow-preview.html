<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rune feedback QA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Synthetic test saves only: open on a dedicated QA origin.
      import {
        createGame,
        applyAction,
        applyActionStepped,
        getLegalActions,
      } from "/src/game/engine.ts";
      import { getRuneChanges } from "/src/game/rune-presentation.ts";
      import { createCombatFixture } from "./fixtures/combat.ts";
      import { SAVE_KEY } from "/src/persistence.ts";
      const mode =
        new URLSearchParams(location.search).get("mode") ?? "channel";
      let before, action;
      if (mode === "channel") {
        before = applyAction(
          createGame({ seed: 44, firstPlayer: 0 }),
          "mulligan:",
        );
        action = getLegalActions(before, 1).find((a) => a.id === "mulligan:");
      } else {
        before = createCombatFixture();
        before.phase = "main";
        before.combat = null;
        before.players[0].hand = ["ogn-024-298"];
        before.players[0].energy = 0;
        before.players[0].power = 0;
        before.players[0].runes = Array.from({ length: 5 }, (_, i) => ({
          id: `qa-rune-${i}`,
          domain: "Fury",
          ready: mode !== "ready",
        }));
        if (mode === "ready") {
          before.currentPlayer = 1;
          before.priorityPlayer = 1;
          before.focusPlayer = 1;
          action = getLegalActions(before, 1).find((a) => a.category === "end");
        } else
          action = getLegalActions(before, 0).find(
            (a) => a.category === "play" && a.cardId === "ogn-024-298",
          );
      }
      const result = applyActionStepped(before, action);
      const review = {
        before,
        final: result.state,
        frames: result.frames,
        index: 0,
        action,
      };
      review.index = result.frames.findIndex((_, index) =>
        getRuneChanges({ ...review, index }).some((c) => c.kind === mode),
      );
      localStorage.setItem(
        SAVE_KEY,
        JSON.stringify({ match: result.state, review }),
      );
      await import("/src/main.tsx");
    </script>
  </body>
</html>
