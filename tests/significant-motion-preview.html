<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Significant motion QA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Replace only an isolated test origin's save; never a hosted game session.
      import {
        createSignificantMotionSession,
        significantMotionModes,
      } from "./fixtures/significant-motion.ts";
      import { SAVE_KEY } from "/src/persistence.ts";
      if (!["localhost", "127.0.0.1", "[::1]"].includes(location.hostname))
        throw new Error(
          "Motion QA fixtures are restricted to loopback origins",
        );
      const params = new URLSearchParams(location.search);
      const mode = params.get("mode") || "champion";
      if (!significantMotionModes.includes(mode))
        throw new Error(`Unknown motion QA fixture: ${mode}`);
      const session = createSignificantMotionSession(mode);
      if (params.has("index")) {
        const index = Number(params.get("index"));
        if (
          !Number.isSafeInteger(index) ||
          index < 0 ||
          index >= session.review.frames.length
        )
          throw new Error("Invalid motion QA review index");
        session.review.index = index;
      }
      if (params.has("paused"))
        session.paused = params.get("paused") !== "false";
      localStorage.setItem("riftbound-duel-language", "en");
      localStorage.setItem(SAVE_KEY, JSON.stringify(session));
      await import("/src/main.tsx");
    </script>
  </body>
</html>
