<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile duel QA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Synthetic fixtures replace only the test origin's save. Use an isolated loopback port.
      import {
        createMobileDuelSession,
        mobileDuelModes,
      } from "./fixtures/mobile-duel.ts";
      import { SAVE_KEY } from "/src/persistence.ts";
      if (!["localhost", "127.0.0.1", "[::1]"].includes(location.hostname))
        throw new Error(
          "Mobile QA fixtures are restricted to loopback origins",
        );
      const params = new URLSearchParams(location.search);
      const mode = params.get("mode") || "main";
      if (!mobileDuelModes.includes(mode))
        throw new Error(`Unknown mobile QA fixture: ${mode}`);
      const session = createMobileDuelSession(mode);
      if (params.has("paused"))
        session.paused = params.get("paused") !== "false";
      localStorage.setItem("riftbound-duel-language", "en");
      localStorage.setItem(SAVE_KEY, JSON.stringify(session));
      await import("/src/main.tsx");
    </script>
  </body>
</html>
