<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile table QA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Synthetic fixture on a separate loopback origin, never a live saved duel.
      import { createCombatFixture, combatUnit } from "./fixtures/combat.ts";
      import { SAVE_KEY, parseSession } from "/src/persistence.ts";
      const match = createCombatFixture();
      const mode = new URLSearchParams(location.search).get("mode") || "main";
      if (mode !== "combat") {
        match.phase = "main";
        match.combat = null;
        match.units = match.units.map((unit) => ({
          ...unit,
          location: unit.owner === 0 ? "field:0" : "field:1",
          ready: true,
        }));
      }
      match.turnStep = "main";
      match.units.push(
        ...Array.from({ length: 8 }, (_, i) => ({
          ...combatUnit(
            `base-unit-${i}`,
            0,
            3,
            ["ogn-175-298", "ogn-049-298", "ogn-088-298", "ogn-219-298"][i % 4],
          ),
          location: "base:0",
          ready: true,
        })),
      );
      match.units.push({
        ...combatUnit("enemy-base-unit", 1),
        location: "base:1",
      });
      match.players[0].hand = [
        "ogn-009-298",
        "ogn-058-298",
        "ogn-049-298",
        "ogn-083-298",
        "ogn-175-298",
        "ogn-088-298",
        "ogn-219-298",
      ];
      match.players[0].discard = ["ogn-009-298", "ogn-049-298"];
      for (const player of match.players) {
        player.championAvailable = true;
        player.runes = Array.from({ length: 8 }, (_, i) => ({
          id: `rune-${player.id}-${i}`,
          domain: i % 2 ? "Fury" : "Calm",
          ready: i < 5,
        }));
        player.energy = 4;
      }
      const session = { match, review: null };
      if (!parseSession(JSON.stringify(session)).match)
        throw new Error("Invalid mobile fixture");
      localStorage.setItem("riftbound-duel-language", "en");
      localStorage.setItem(SAVE_KEY, JSON.stringify(session));
      await import("/src/main.tsx");
    </script>
  </body>
</html>
