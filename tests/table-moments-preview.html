<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table moments QA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Synthetic local QA only. Use an isolated localhost port to preserve real saves.
      import {
        createGame,
        applyAction,
        applyActionStepped,
        getLegalActions,
      } from "/src/game/engine.ts";
      import { combatUnit } from "./fixtures/combat.ts";
      import { SAVE_KEY } from "/src/persistence.ts";
      const mode = new URLSearchParams(location.search).get("mode") || "board";
      const opening = () => {
        const game = applyAction(
          applyAction(createGame({ seed: 44 }), "mulligan:"),
          "mulligan:",
        );
        game.players.forEach((p) => (p.legendId = "ogs-009-024"));
        return game;
      };
      let before = opening(),
        action,
        index = 0,
        review = null,
        match = before;
      if (
        ["awaken", "beginning", "channel", "draw", "opponent-draw"].includes(
          mode,
        )
      ) {
        before = applyAction(
          createGame({
            seed: 44,
            firstPlayer: mode === "opponent-draw" ? 1 : 0,
          }),
          "mulligan:",
        );
        action = getLegalActions(before, 1).find((a) => a.id === "mulligan:");
      } else if (["hold", "winning-hold", "hold-draw"].includes(mode)) {
        before.fields[0] = {
          id: "field:0",
          cardId: "ogn-280-298",
          controller: 0,
        };
        before.units = [combatUnit("holder", 0, 4)];
        before.players[0].points = mode === "winning-hold" ? 7 : 3;
        before.currentPlayer = 1;
        before.priorityPlayer = 1;
        before.focusPlayer = 1;
        action = getLegalActions(before, 1).find((a) => a.id === "end-turn");
      } else if (["conquer", "replacement"].includes(mode)) {
        before.players[0].points = mode === "replacement" ? 7 : 2;
        before.units = [
          { ...combatUnit("mover", 0, 4), location: "base:0", ready: true },
        ];
        before = applyAction(before, "move-start:mover:field:0");
        action = getLegalActions(before, 0).find(
          (a) => a.id === "move-confirm",
        );
      } else {
        const setup = createGame({ seed: 44 });
        before.players.forEach((player) => {
          player.legendId = setup.players[player.id].legendId;
        });
        before.fields[1].cardId = "ogn-275-298";
        before.units = [
          { ...combatUnit("own-base", 0, 3), location: "base:0", ready: true },
          {
            ...combatUnit("enemy-base", 1, 4),
            location: "base:1",
            ready: true,
          },
          { ...combatUnit("own-field", 0, 4), ready: true },
          {
            ...combatUnit("enemy-field", 1, 3),
            location: "field:1",
            ready: true,
          },
        ];
        before.fields[0].controller = 0;
        before.fields[1].controller = 1;
        before.players[0].points = 3;
        before.players[1].points = 2;
        before.players[1].runes = [
          { id: "rival-mind", domain: "Mind", ready: true },
          { id: "rival-order", domain: "Order", ready: true },
        ];
        match = before;
      }
      if (action) {
        let result = applyActionStepped(before, action);
        if (["hold-draw", "conquer", "replacement"].includes(mode)) {
          for (
            let i = 0;
            i < 10 &&
            !result.frames.some(
              (f) => f.draw?.player === 0 || (mode === "conquer" && f.score),
            );
            i++
          ) {
            before = result.state;
            action = getLegalActions(before, before.priorityPlayer).find(
              (a) => a.id === "pass",
            );
            if (!action) break;
            result = applyActionStepped(before, action);
          }
        }
        match = result.state;
        index = ["conquer", "hold", "winning-hold"].includes(mode)
          ? result.frames.findIndex((f) => f.score)
          : ["replacement", "hold-draw", "opponent-draw", "draw"].includes(mode)
            ? result.frames.findIndex((f) => f.draw)
            : result.frames.findIndex((f) => f.state.turnStep === mode);
        if (index < 0) throw new Error(`Missing fixture ${mode}`);
        review = { before, final: match, frames: result.frames, index, action };
      }
      localStorage.setItem(SAVE_KEY, JSON.stringify({ match, review }));
      localStorage.setItem("riftbound-duel-language", "en");
      await import("/src/main.tsx");
    </script>
  </body>
</html>
